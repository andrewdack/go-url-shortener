# Compose defines three services:
# 1. redis: a Redis server running in a Docker container on port 6379, used as a cache
# 2. postgres: a Postgres server on port 5432, the durable source of truth for URL mappings
# 3. backend: go backend service that depends on both and runs on port 9808
services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-net

  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis:6379
      DATABASE_URL: postgres://shortener:shortener@postgres:5432/shortener?sslmode=disable
      PUBLIC_HOST: http://localhost:9808/
      ENV: development
    ports:
      - "127.0.0.1:9808:9808"
    restart: unless-stopped
    # Healthcheck for the backend service to ensure it is running and responsive
    # Make sure backend service has a /health endpoint that returns 200 OK when healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9808/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

# persistent volumes for Redis and Postgres data
volumes:
  redis-data:
  postgres-data:

