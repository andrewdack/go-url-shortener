# Compose defines two services: 
# 1. redis: a Redis server running in a Docker container on port 6379
# 2. backend: a backend service that depends on the Redis server and runs on port 9808
#             and takes envs for Redis address and environment mode.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis:6379
      PUBLIC_HOST: http://localhost:9808/
      ENV: development
    ports:
      - "127.0.0.1:9808:9808"
    restart: unless-stopped
    # Healthcheck for the backend service to ensure it is running and responsive
    # Make sure backend service has a /health endpoint that returns 200 OK when healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9808/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

# persistent volume for Redis data
volumes:
  redis-data:
  
